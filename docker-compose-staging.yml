# Detailer — standalone staging. Start parent compose first (shared client_staging_redis).
# docker compose -f docker-compose-staging.yml up -d --build

name: prisma_detailer_staging

services:
  detailer_postgres:
    image: postgres:16-alpine
    container_name: detailer_postgres_staging
    env_file:
      - .env.staging
    volumes:
      - detailer_staging_pgdata:/var/lib/postgresql/data
    networks:
      - prisma_shared_net
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  detailer_staging_server:
    container_name: detailer_staging_server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8200:8000"
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
    command: daphne -b 0.0.0.0 -p 8000 prisma.asgi:application
    depends_on:
      detailer_postgres:
        condition: service_healthy
    networks:
      - prisma_shared_net

  detailer_staging_celery_worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: detailer_staging_celery_worker
    command: celery -A prisma.celery worker --loglevel=info
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
      - CELERY_WORKER_CONCURRENCY=3
    depends_on:
      detailer_staging_server:
        condition: service_started
      detailer_postgres:
        condition: service_healthy
    networks:
      - prisma_shared_net

  detailer_staging_celery_beat:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: detailer_staging_celery_beat
    command: celery -A prisma.celery beat --loglevel=info
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
    depends_on:
      detailer_staging_server:
        condition: service_started
      detailer_postgres:
        condition: service_healthy
    networks:
      - prisma_shared_net

  detailer_staging_appointment_subscriber:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: detailer_staging_appointment_subscriber
    command: python manage.py appointment_subscriber
    volumes:
      - ./server/prisma:/app
    env_file:
      - .env.staging
    environment:
      - DJANGO_SETTINGS_MODULE=prisma.settings
      - PRISMA_ENV=staging
      - REDIS_HOST=client_staging_redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://client_staging_redis:6379/2
    depends_on:
      detailer_staging_server:
        condition: service_started
      detailer_postgres:
        condition: service_healthy
    restart: always
    networks:
      - prisma_shared_net

volumes:
  detailer_staging_pgdata:

networks:
  prisma_shared_net:
    external: true
